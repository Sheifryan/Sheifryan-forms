services:
  app:
    build:
      context: .
      args:
        # NEXT_PUBLIC_* vars are inlined at build time (read from your .env).
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    env_file:
      # .env is gitignored, so it won't exist in the cloned repo on Coolify.
      # All variables are injected via the Coolify dashboard environment
      # instead; the env_file is optional (only used for local compose runs).
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
    # Join Coolify's proxy network so Traefik can route the app's domain to
    # this container (host ports like 7812 are only for direct host access).
    networks:
      - coolify
    labels:
      # Coolify generates the domain's Traefik ROUTERS for this app but omits
      # the loadbalancer port AND the router→service binding on compose
      # deployments. Mirror Coolify's working-app label set exactly: bind each
      # router to its service and declare the port on that service. Names must
      # match the "<type>-<index>-<uuid>-app" pattern Coolify generates.
      - traefik.http.routers.http-0-mpy5075eidyf9ia145gxady4-app.service=http-0-mpy5075eidyf9ia145gxady4-app
      - traefik.http.routers.http-1-mpy5075eidyf9ia145gxady4-app.service=http-1-mpy5075eidyf9ia145gxady4-app
      - traefik.http.routers.https-1-mpy5075eidyf9ia145gxady4-app.service=https-1-mpy5075eidyf9ia145gxady4-app
      - traefik.http.services.http-0-mpy5075eidyf9ia145gxady4-app.loadbalancer.server.port=3000
      - traefik.http.services.http-1-mpy5075eidyf9ia145gxady4-app.loadbalancer.server.port=3000
      - traefik.http.services.https-1-mpy5075eidyf9ia145gxady4-app.loadbalancer.server.port=3000
    ports:
      # App runs on :3000 inside the container; expose it on the host at a
      # less-common port so it doesn't collide with other services on the VPS.
      - "7812:3000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  coolify:
    external: true
